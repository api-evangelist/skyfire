name: Skyfire
description: >-
  Skyfire is the open identity and payments layer for AI agents. It lets AI
  agents securely create accounts, verify a real-world identity (Know Your Agent,
  KYA), and autonomously pay for digital services using token-based
  authentication and stablecoin settlement. Developers use Skyfire to monetize
  APIs, tools, MCP servers, and content directly to agents. The platform issues
  three signed, interoperable KYAPay token types — kya (identity), pay (payment),
  and kya-pay (combined) — that buyer agents present to seller services over a
  simple REST API and a hosted MCP server. Sellers validate and charge tokens,
  discover services, and manage seller-service lifecycles, while enterprises
  manage users and agents through admin APIs. Skyfire is backed by DCVC,
  Lightspeed Venture Partners, and Trinity Ventures.
