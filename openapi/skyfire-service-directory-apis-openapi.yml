  /api/v1/directory/agents/{agentId}/services:
    get:
      summary: Get Services by Agent
      description: Get all of the services belonging to a single agent.
      operationId: get-services-by-agent
      parameters:
      - in: path
        name: agentId
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the agent whose services you want to get. Must be a valid UUID. e.g. `"98755a15-bcbb-4e7c-a4ac-0ae21b9ce5c7"`
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: The matching services.
                    items:
                      $ref: '#/components/schemas/DirectoryService'
              examples:
                Ok:
                  summary: Ok
                  value:
                    data:
                    - id: 350d433d-6ed4-4482-bcfc-14b7da807f9b
