components:
  schemas:
    OrganizationUser:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the organization user.
        organizationId:
          type: string
          description: Unique identifier of the organization the user belongs to. Always your own organization.
        email:
          type: string
          description: Email address of the user.
        isAdmin:
          type: boolean
          description: Whether the user has Organization Admin privileges.
        orgMemberRole:
          type: string
          description: Role of the user within the organization.
          enum:
          - ADMIN
          - MEMBER
          - REPRESENTATIVE
        isActive:
          type: boolean
          description: Whether the user is active. Inactive users cannot authenticate, and neither can their agents.
        agents:
          type: array
          description: Agents owned by the user. Empty if the user owns none.
          items:
            type: object
            properties:
              agentId:
                type: string
                description: Unique identifier of the agent.
              agentType:
                type: string
                description: Whether the agent is a buyer or a seller.
                enum:
                - BUYER
                - SELLER
              accounts:
                type: array
                description: Accounts belonging to the agent.
                items:
                  type: object
                  properties:
                    accountId:
                      type: string
                      description: Unique identifier of the account.
                    network:
                      type: string
                      description: Network the account is held on. e.g. `"base"`.
                    active:
                      type: boolean
                      description: Whether the account is active.
                    suspended:
                      type: boolean
                      description: Whether the account is suspended.
                    createdAt:
                      type: string
                      description: When the account was created. e.g. `"2026-08-14T09:12:33.000Z"`.
                  required:
                  - accountId
                  - network
                  - active
                  - suspended
                  - createdAt
            required:
            - agentId
            - agentType
        createdAt:
          type: string
          description: When the user was created. e.g. `"2026-08-14T09:12:33.000Z"`.
      required:
      - id
      - organizationId
      - email
      - isAdmin
      - orgMemberRole
      - isActive
      - createdAt
  securitySchemes:
    sec0:
      type: apiKey
      name: skyfire-api-key
      in: header
