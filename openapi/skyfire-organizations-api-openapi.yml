    get:
      description: As an Organization Admin, list the API keys of an agent belonging to a user in your organization.
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the user who owns the agent. e.g. `"906fc259-ef0a-4736-bdcd-c1d5a78db483"`
      - in: path
        name: agentId
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the agent whose keys to list. e.g. `"5d084831-4a11-4970-bf62-bb6fc0b9f3a2"`
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 1000
        description: Number of keys to return per page. Defaults to `100`, maximum `1000`. e.g. `50`
      - in: query
        name: pageCursor
        schema:
          type: string
        description: Cursor for the next page, taken from `nextPageCursor` in the previous response. Results are ordered by creation time ascending, and the cursor is the ID of the last key on the previous page.
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the API key. Use this ID to activate or deactivate the key.
                        lastFour:
                          type: string
                          description: Last four characters of the key, for identification. The full key is never returned.
                        active:
                          type: boolean
                          description: Whether the key currently authenticates.
                        notes:
                          type: string
                          description: The label provided at creation. Omitted when none was set.
                        createdAt:
                          type: string
                          description: When the key was created. e.g. `"2026-08-28T17:04:11.000Z"`.
                      required:
                      - id
                      - lastFour
                      - active
                      - createdAt
                  nextPageCursor:
                    type: string
                    description: Present when more keys remain. Pass it back as `pageCursor` to fetch the next page.
                required:
                - data
              examples:
                Single page:
                  summary: Single page
                  value:
                    data:
                    - id: d52e9a3c-7b4f-4c0d-9e2a-1f3b5c7d9e21
                      lastFour: 77af
                      active: false
                      createdAt: '2026-05-11T08:22:45.000Z'
                    - id: c41d8f2b-6a3e-4b9c-8d1f-0e2a4b6c8d10
                      lastFour: 9f2c
                      active: true
                      notes: Q3 rotation
                      createdAt: '2026-08-28T17:04:11.000Z'
                More pages available:
                  summary: More pages available
                  value:
                    data:
                    - id: d52e9a3c-7b4f-4c0d-9e2a-1f3b5c7d9e21
                      lastFour: 77af
                      active: false
                      createdAt: '2026-05-11T08:22:45.000Z'
                    nextPageCursor: d52e9a3c-7b4f-4c0d-9e2a-1f3b5c7d9e21
          headers:
            Link:
              description: Present when more keys remain. Points at the next page with rel="next"; the same cursor is returned as nextPageCursor in the body.
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Bad Request:
                  summary: Bad Request
                  value:
                    code: BAD_REQUEST
                    message: 'Invalid pageCursor: expected the cursor returned by a previous page'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    code: NOT_AUTHORIZED
                    message: Invalid Organization User API Key
        '404':
