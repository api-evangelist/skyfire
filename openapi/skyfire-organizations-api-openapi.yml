  /api/v1/organizations/users/{userId}/activate:
    patch:
      summary: Set Organization User Status as Active
      description: As an Organization Admin, reactivate a deactivated user in your organization.
      operationId: patch_api-v1-organizations-users-userid-activate
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the organization user. Must be a user in your own organization. e.g. `"906fc259-ef0a-4736-bdcd-c1d5a78db483"`
      responses:
        '204':
          description: No Content. The user is active.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    code: NOT_AUTHORIZED
                    message: Invalid Organization User API Key
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Not Found:
                  summary: Not Found
                  value:
                    code: NOT_FOUND
                    message: User not found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Unprocessable Entity:
                  summary: Unprocessable Entity
                  value:
                    code: VALIDATION_ERROR
                    message: Validation Error
                    details:
                      userId:
                        message: Must be a valid UUID
