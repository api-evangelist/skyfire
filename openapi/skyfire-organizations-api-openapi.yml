openapi: 3.2.0
info:
  title: skyfire-agent-and-token-apis Organizations API
  version: '1.0'
servers:
- url: https://api.skyfire.xyz
security:
- sec0: []
tags:
- name: Organizations
paths:
  /api/v1/organizations/users:
    post:
      summary: Create Organization User
      description: As an Organization Admin, create a new user in your organization.
      operationId: create-enterprise-user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - role
              properties:
                email:
                  type: string
                  description: Email address of the new organization user. Must be unique within your organization. e.g. `chloe@gmail.com`
                role:
                  type: string
                  description: Organization role for the new user. `MEMBER` creates a standard organization user. `ADMIN` creates an Organization Admin, which additionally returns `userApiKey` in the response.
                  enum:
                  - MEMBER
                  - ADMIN
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              examples:
                'Role: ADMIN':
                  summary: 'Role: ADMIN'
                  value:
                    userId: 4da70647-e1f0-4508-bef0-8866bb7a3d01
                    buyerAgent:
                      id: c01fe0c7-517e-446e-88d5-b10d84974b87
                      apiKey: e4661d3e-43a9-4d38-927c-ea7d2ff92403
                    userApiKey: 60b664e7-8fc1-48bf-8362-83555e80b2bd
                'Role: MEMBER':
                  summary: 'Role: MEMBER'
                  value:
                    userId: 906fc259-ef0a-4736-bdcd-c1d5a78db483
                    buyerAgent:
                      id: 5d084831-4a11-4970-bf62-bb6fc0b9f3a2
                      apiKey: aff074ee-ea8b-4643-bad1-913a534a5d7a
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    example: 906fc259-ef0a-4736-bdcd-c1d5a78db483
                    description: Unique identifier of the newly created organization user.
                  buyerAgent:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 5d084831-4a11-4970-bf62-bb6fc0b9f3a2
                        description: Unique identifier of the buyer agent.
                      apiKey:
                        type: string
                        example: aff074ee-ea8b-4643-bad1-913a534a5d7a
                        description: API key for the buyer agent. Returned only in this response and cannot be retrieved again, store it securely.
                    description: Unique identifier of the buyer agent.
                  userApiKey:
                    type: string
                    description: Organization Admin API key for the new user. Present only when `role` is `ADMIN`; for `MEMBER` the field is omitted from the body rather than returned as null. Returned only in this response and cannot be retrieved again, store it securely.
                required:
                - userId
                - buyerAgent
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                Bad Request:
                  summary: Bad Request
                  value:
                    code: BAD_REQUEST
                    message: Cannot create organization user. Organization user with email ada@example.com already exists
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: BAD_REQUEST
                  message:
                    type: string
                    example: Cannot create organization user. Organization user with email ada@example.com already exists
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    code: NOT_AUTHORIZED
                    message: Invalid Organization User API Key
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              examples:
                Unprocessable Entity:
                  summary: Unprocessable Entity
                  value:
                    code: VALIDATION_ERROR
                    message: Validation Error
                    details:
                      request.email:
                        message: Must be a valid email address
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Validation Error
                  details:
                    type: object
                    properties:
                      request.email:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Must be a valid email address
      x-readme:
        code-samples:
        - code: "curl -i -X POST 'https://api.skyfire.xyz/api/v1/organizations/users' \\\n  -H 'skyfire-api-key: 039695d8-bb96-408d-b31a-6afddf0c33cb' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"email\":\"chloe@gmail.com\",\"role\":\"MEMBER\"}'"
          language: shell
          name: cURL
        - code: "const res = await fetch(\n  'https://api.skyfire.xyz/api/v1/organizations/users',\n  {\n    method: 'POST',\n    headers: {\n      'skyfire-api-key': '039695d8-bb96-408d-b31a-6afddf0c33cb',\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify({ email: 'chloe@gmail.com', role: 'MEMBER' })\n  }\n);\nconsole.log(await res.json());"
          language: node
          name: ''
        - code: "import http.client\nimport json\n\nconn = http.client.HTTPSConnection(\"api.skyfire.xyz\")\nheaders = {\n  'skyfire-api-key': '039695d8-bb96-408d-b31a-6afddf0c33cb',\n  'Content-Type': 'application/json'\n}\npayload = json.dumps({\"email\": \"chloe@gmail.com\", \"role\": \"MEMBER\"})\nconn.request(\"POST\", \"/api/v1/organizations/users\", payload, headers)\nres = conn.getresponse()\nprint(res.read().decode(\"utf-8\"))"
          language: python
          name: ''
        samples-languages:
        - shell
        - node
        - python
      tags:
      - Organizations
    get:
      summary: Get Organization Users
      description: As an Organization Admin, list the users in your organization.
      operationId: get_api-v1-organizations-users
      parameters:
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 1000
        description: Number of users to return per page. Defaults to `100`, maximum `1000`. e.g. `50`
      - in: query
        name: pageCursor
        schema:
          type: string
        description: Cursor for the next page, taken from `nextPageCursor` in the previous response. Results are ordered by email ascending, and the cursor is the email of the last user on the previous page. e.g. `"chloe@gmail.com"`
      - in: query
        name: filter
        schema:
          type: string
        description: 'A JSON object, encoded as a string, restricting which users are returned. Conditions combine with AND. Must be valid JSON. Supported keys: `id`, `email`, `identifier`, `active`, `admin`, `orgMemberRole`. e.g. `filter={"orgMemberRole":"REPRESENTATIVE"}`'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationUser'
                  nextPageCursor:
                    type: string
                    description: Present when more users remain. Pass it back as `pageCursor` to fetch the next page.
                required:
                - data
              examples:
                More pages available:
                  summary: More pages available
                  value:
                    data:
                    - id: 906fc259-ef0a-4736-bdcd-c1d5a78db483
                      organizationId: 1f6c2f8e-9a45-4f7b-bd21-3c0e5a9d7412
                      email: chloe@gmail.com
                      isAdmin: false
                      orgMemberRole: MEMBER
                      isActive: true
                      agents: []
                      createdAt: '2026-08-14T09:12:33.000Z'
                    nextPageCursor: chloe@gmail.com
                Single page:
                  summary: Single page
                  value:
                    data:
                    - id: 906fc259-ef0a-4736-bdcd-c1d5a78db483
                      organizationId: 1f6c2f8e-9a45-4f7b-bd21-3c0e5a9d7412
                      email: ada@example.com
                      isAdmin: false
                      orgMemberRole: MEMBER
                      isActive: true
                      agents:
                      - agentId: 5d084831-4a11-4970-bf62-bb6fc0b9f3a2
                        agentType: BUYER
                        accounts:
                        - accountId: 8b3d1e57-24af-4c69-9f0a-6d5e7b21c834
                          network: base
                          active: true
                          suspended: false
                          createdAt: '2026-08-14T09:12:33.000Z'
                      createdAt: '2026-08-14T09:12:33.000Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                    description: ''
              examples:
                Bad Request:
                  summary: Bad Request
                  value:
                    code: BAD_REQUEST
                    message: 'Invalid page size: 5000'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                    description: ''
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    code: NOT_AUTHORIZED
                    message: Invalid Organization User API Key
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Unprocessable Entity:
                  summary: Unprocessable Entity
                  value:
                    code: VALIDATION_ERROR
                    message: Validation Error
                    details:
                      pageSize:
                        message: invalid float number
      x-readme:
        code-samples:
        - code: "curl -i -X GET 'https://api.skyfire.xyz/api/v1/organizations/users?pageSize=50' \\\n  -H 'skyfire-api-key: ec0bf984-34f9-4e1e-a06e-984f3dfb089e'"
          language: shell
          name: cURL
        - code: "const res = await fetch(\n  'https://api.skyfire.xyz/api/v1/organizations/users?pageSize=50',\n  { headers: { 'skyfire-api-key': 'ec0bf984-34f9-4e1e-a06e-984f3dfb089e' } }\n);\nconsole.log(await res.json());"
          language: node
          name: ''
        - code: 'import http.client


            conn = http.client.HTTPSConnection("api.skyfire.xyz")

            headers = {''skyfire-api-key'': ''ec0bf984-34f9-4e1e-a06e-984f3dfb089e''}

            conn.request("GET", "/api/v1/organizations/users?pageSize=50", None, headers)

            res = conn.getresponse()

            print(res.read().decode("utf-8"))'
          language: python
          name: ''
        samples-languages:
        - shell
        - node
        - python
      tags:
      - Organizations
  /api/v1/organizations/users/email/{email}:
    get:
      description: As an Organization Admin, fetch a single user in your organization by their exact email address.
      parameters:
      - in: path
        name: email
        required: true
        schema:
          type: string
          format: email
        description: Email address of the user. Exact match, case-insensitive. Must be URL-encoded. e.g. `ada%40example.com`
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUser'
              examples:
                Ok:
                  summary: Ok
                  value:
                    id: 906fc259-ef0a-4736-bdcd-c1d5a78db483
                    organizationId: 1f6c2f8e-9a45-4f7b-bd21-3c0e5a9d7412
                    email: ada@example.com
                    isAdmin: false
                    orgMemberRole: MEMBER
                    isActive: true
                    agents:
                    - agentId: 5d084831-4a11-4970-bf62-bb6fc0b9f3a2
                      agentType: BUYER
                      accounts:
                      - accountId: 8b3d1e57-24af-4c69-9f0a-6d5e7b21c834
                        network: base
                        active: true
                        suspended: false
                        createdAt: '2026-08-14T09:12:33.000Z'
                    createdAt: '2026-08-14T09:12:33.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    code: NOT_AUTHORIZED
                    message: Invalid Organization User API Key
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Not Found:
                  summary: Not Found
                  value:
                    code: NOT_FOUND
                    message: User not found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Unprocessable Entity:
                  summary: Unprocessable Entity
                  value:
                    code: VALIDATION_ERROR
                    message: Validation Error
                    details:
                      email:
                        message: Must be a valid email address
      operationId: get_api-v1-organizations-users-email
      x-readme:
        code-samples:
        - code: "curl -i -X GET 'https://api.skyfire.xyz/api/v1/organizations/users/email/ada%40example.com' \\\n  -H 'skyfire-api-key: ec0bf984-34f9-4e1e-a06e-984f3dfb089e'"
          language: shell
          name: cURL
        - code: "const email = encodeURIComponent('ada@example.com');\nconst res = await fetch(\n  `https://api.skyfire.xyz/api/v1/organizations/users/email/${email}`,\n  { headers: { 'skyfire-api-key': 'ec0bf984-34f9-4e1e-a06e-984f3dfb089e' } }\n);\nconsole.log(await res.json());"
          language: node
          name: ''
        - code: 'import http.client

            from urllib.parse import quote


            conn = http.client.HTTPSConnection("api.skyfire.xyz")

            headers = {''skyfire-api-key'': ''ec0bf984-34f9-4e1e-a06e-984f3dfb089e''}

            email = quote("ada@example.com", safe="")

            conn.request("GET", f"/api/v1/organizations/users/email/{email}", None, headers)

            res = conn.getresponse()

            print(res.read().decode("utf-8"))'
          language: python
          name: ''
        samples-languages:
        - shell
        - node
        - python
      summary: Get Organization User by Email
