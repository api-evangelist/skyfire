  /api/v1/organizations/users/{userId}/agents/seller:
    post:
      summary: Create Seller Agent
      description: As an Organization Admin, create a seller agent for a user in your organization.
      operationId: create-enterprise-user-2
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the organization user who will own the seller agent. Must be a user in your own organization. e.g. `"906fc259-ef0a-4736-bdcd-c1d5a78db483"`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - displayName
              properties:
                displayName:
                  type: string
                  description: Label for the new seller agent. Does not have to be unique. e.g. `"Chloe Cupcakes"`.
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              examples:
                Ok:
                  summary: Ok
                  value:
                    id: b7c1f2a4-6d38-4e91-9c05-2f8ad4e7b613
                    apiKey: d92e5c07-13ab-4f6e-8a24-71c0be3d9f45
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 906fc259-ef0a-4736-bdcd-c1d5a78db483
                    description: Unique identifier of the created seller agent.
                  apiKey:
                    type: string
                    description: API key for the seller agent. Returned only in this response and cannot be retrieved again, store it securely.
                required:
                - id
                - apiKey
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                Bad Request:
                  summary: Bad Request
                  value:
                    code: BAD_REQUEST
                    message: Agent already exists
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: BAD_REQUEST
                  message:
                    type: string
                    example: Agent already exists
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    code: NOT_AUTHORIZED
                    message: Invalid Organization User API Key
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                Not Found:
                  summary: Not Found
                  value:
                    code: NOT_FOUND
                    message: User not found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              examples:
                Unprocessable Entity:
                  summary: Unprocessable Entity
                  value:
                    code: VALIDATION_ERROR
                    message: Validation Error
                    details:
                      userId:
                        message: Must be a valid UUID
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Validation Error
                  details:
                    type: object
                    properties:
                      userId:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Must be a valid UUID
