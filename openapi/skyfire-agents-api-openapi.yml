      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New name of the service.
                description:
                  type: string
                  description: New description of the service.
                tags:
                  type: array
                  description: New tags for the service.
                  items:
                    type: string
                minimumTokenAmount:
                  type: string
                  description: New minimum amount (in USD) that buyers must set on their tokens.
                price:
                  type: string
                  description: New price of the service in USD.
                termsOfService:
                  type: object
                  description: New terms of service for this service.
                  properties:
                    url:
