paths:
  /api/v1/agents/balance:
    get:
      summary: Get Agent's Wallet Balance
      description: Get the wallet balance of the agent.
      operationId: get-agents-wallet-balance
      responses:
        '200':
          description: Ok
          content:
            application/json:
              examples:
                Ok:
                  summary: Ok
                  value:
                    available: '0.316285'
                    heldAmount: '0'
                    pendingCharges: '0'
                    pendingDeposits: '0.013001'
              schema:
                type: object
                properties:
                  available:
                    type: string
                    description: Funds available in the agent's wallet, as a decimal string.
                  heldAmount:
                    type: string
                    description: Funds currently held, as a decimal string.
                  pendingCharges:
                    type: string
                    description: Charges that are still pending, as a decimal string.
                  pendingDeposits:
                    type: string
                    description: Deposits that are still pending, as a decimal string.
      x-readme:
        code-samples:
        - code: "curl -i -X GET 'https://api.skyfire.xyz/api/v1/agents/balance' \\\n  -H 'skyfire-api-key: 1fd8543f-0fc6-4f80-9b6e-08d9eecbbdf0'"
          language: shell
          name: cURL
        - code: "const res = await fetch(\n  'https://api.skyfire.xyz/api/v1/agents/balance',\n  { headers: { 'skyfire-api-key': '1fd8543f-0fc6-4f80-9b6e-08d9eecbbdf0' } }\n);\nconsole.log(await res.json());"
          language: node
          name: ''
        - code: 'import http.client


            conn = http.client.HTTPSConnection("api.skyfire.xyz")

            headers = {''skyfire-api-key'': ''1fd8543f-0fc6-4f80-9b6e-08d9eecbbdf0''}

            conn.request("GET", "/api/v1/agents/balance", None, headers)

            res = conn.getresponse()

            print(res.read().decode("utf-8"))'
          language: python
          name: ''
        samples-languages:
        - shell
        - node
        - python
      tags:
      - Agents
