  /api/v1/tokens:
    post:
      summary: Create Token
      description: Create a `kya`, `pay`, or `kya-pay` token as a buyer agent.
      operationId: create-token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                type:
                  type: string
                  description: One of `kya`, `pay`, or `kya-pay`. The created token will contain JWT header `typ` set to `<type>+jwt`.
                buyerTag:
                  type: string
                  description: Buyer’s internal identifier for the token. e.g. "research-agent-xyz"
                tokenAmount:
                  type: string
                  description: 'The amount of funds in currency units allocated to the token. Determines the maximum amount the seller can charge. Must include if this is a `pay`or `kya-pay` token. For successful token creation, this value must be:

                    - Greater than 0

                    - Less than or equal to the buyer agent wallet balance

                    - Greater than or equal to the seller service minimum token amount (if applicable)


                    If these conditions are not met, the token creation request will fail.'
                sellerServiceId:
                  type: string
                  description: ID of an onboarded seller service. Obtain this from the Skyfire Directory. Required when creating a token for an onboarded seller.
                sellerDomainOrUrl:
                  type: string
                  description: Domain name or full URL of an external seller. The buyer agent must belong to an organization and authenticate using an Organization Buyer API Key. Required when creating a token for an external seller.
                expiresAt:
                  type: integer
                  description: 'Unix timestamp (seconds) representing when the token expires. Provide an absolute epoch time, not a relative duration. If omitted, defaults to the maximum allowed lifetimes:

                    * 24 hours from now when using `sellerServiceId`

                    * 5 minutes from now when using `sellerDomainOrUrl`


                    Must be between 10s and the maximum allowed lifetime for the selected target type.'
                  format: int64
                identityPermissions:
                  type: array
                  description: 'Default: empty array. Can be specified if this is a `kya` or `kya-pay` token. Additional identity fields to include in the token. See https://docs.skyfire.xyz/reference/identity-fields for more info.'
                  items:
                    type: string
            examples:
              Create a token to an Onboarded Seller:
                summary: Create a token to an Onboarded Seller
                value:
                  type: kya-pay
                  buyerTag: efd8a6ee-c7b6-4d26-9e5c-3b5e9c180df6
                  tokenAmount: '0.005'
                  sellerServiceId: 350d433d-6ed4-4482-bcfc-14b7da807f9b
                  expiresAt: 1752919200
              Create a token to an External Seller:
                summary: Create a token to an External Seller
                value:
                  type: kya
                  buyerTag: efd8a6ee-c7b6-4d26-9e5c-3b5e9c180df6
                  sellerDomainOrUrl: https://kyapaynews.com
                  expiresAt: 1763769321
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              examples:
                Ok:
                  summary: Ok
                  value:
                    token: eyJhbGciOiJFUzI1NiIsImtpZCI6IjAiLCJ0eXAiOiJreWErcGF5K0pXVCJ9..1MWp5Fj4RTUs-ckOfyXDWzPy1pNl951ZvyGzVdLznUrjRPBKwbIky4OYlo3JMyFu9glaTCrjNn-PnNpwGLO8pQ
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The signed JWT for the token.
                required:
                - token
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    code: NOT_AUTHORIZED
                    message: Subscription Required
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_AUTHORIZED
                  message:
                    type: string
                    example: Subscription Required
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
