        - code: "const res = await fetch(\n  'https://api.skyfire.xyz/api/v1/agents/seller-services',\n  {\n    method: 'POST',\n    headers: {\n      'skyfire-api-key': '72fa67b7-961e-4535-8bab-b8c44bf4e155',\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify({\n      name: 'Weather Data API Service',\n      description: 'Provides real-time weather data and forecasts for global locations. Includes current conditions, 7-day forecasts, and historical weather data.',\n      tags: ['weather', 'api', 'data', 'forecasting'],\n      type: 'API',\n      price: '0.02',\n      priceModel: 'PAY_PER_USE',\n      minimumTokenAmount: '0.02',\n      openApiSpecUrl: 'https://api.weatherservice.com/v1/openapi.json',\n      humanIdentityRequirement: { individual: ['birthdate'], organization: [] },\n      termsOfService: { url: 'https://weatherservice.com/terms', required: true },\n      acceptedTokens: ['pay', 'kya-pay']\n    })\n  }\n);\nconsole.log(await res.json());"
