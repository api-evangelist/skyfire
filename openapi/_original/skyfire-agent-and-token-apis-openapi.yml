    post:
      summary: Create Agent's Service
      description: Create a seller service that belongs to an agent.
      operationId: create-agents-service-1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - description
              - tags
              - type
              - price
              - priceModel
              - minimumTokenAmount
              - humanIdentityRequirement
              properties:
                name:
                  type: string
                  description: The name of the service.
                description:
                  type: string
                  description: The description of the service.
                tags:
                  type: array
                  description: The tags for this service. An empty array is fine.
                  items:
                    type: string
                type:
                  type: string
                  description: 'The type of the service. This is one of: "API", "WEB_PAGE", "MCP_SERVER_REMOTE", "MCP_SERVER_LOCAL", or "FETCH_AGENT"'
                  enum:
                  - API
                  - WEB_PAGE
                  - MCP_SERVER_REMOTE
                  - MCP_SERVER_LOCAL
                  - FETCH_AGENT
                price:
                  type: string
                  description: Price of the service in USD.
                priceModel:
                  type: string
                  description: The pricing model of the service. This is one of "PAY_PER_USE", "SUBSCRIPTION", "PAY_PER_MB", or "CUSTOM".
                  enum:
                  - PAY_PER_USE
                  - SUBSCRIPTION
                  - PAY_PER_MB
                  - CUSTOM
                minimumTokenAmount:
                  type: string
                  description: Buyers must create tokens of at least this amount in USD.
                mcpServerUrl:
                  type: string
                  description: The URL of the MCP Server for this service. This is required if the "type" is "MCP_SERVER_REMOTE" or "MCP_SERVER_LOCAL".
                openApiSpecUrl:
                  type: string
                  description: The URL of the OpenAPI specification for this service. This is required if the "type" is "API".
                websiteUrl:
                  type: string
                  description: The URL of the website. This is required if the "type" is "WEB_PAGE".
                fetchAgentProfileUrl:
                  type: string
                  description: The URL of the Fetch.ai agent. This is required if the "type" is "FETCH_AGENT".
                humanIdentityRequirement:
                  type: object
                  description: The identity verification requirements for individuals, organizations, or both. See https://docs.skyfire.xyz/reference/identity-fields for more info.
                  required:
                  - individual
                  - organization
                  properties:
                    individual:
                      type: array
                      description: List of identity fields required from verified individuals. An empty array indicates no verification required.
                      items:
                        type: string
                    organization:
                      type: array
                      description: List of identity fields required from verified organizations. An empty array indicates no verification required.
                      items:
                        type: string
                termsOfService:
                  type: object
                  description: The details of the terms of service if they exist.
                  properties:
                    url:
                      type: string
                      description: The URL where the terms of service are available to review.
                    required:
                      type: boolean
                      description: '''true'' if acceptance of the terms of service is required.'
                acceptedTokens:
                  type: array
                  items:
                    type: string
                    enum:
                    - kya
                    - pay
                    - kya-pay
                  description: Must be one or more of "kya", "pay" and "kya-pay". Must not be an empty array. If this field is omitted then all token types will be accepted.
                maxTokenTTLSeconds:
                  type: number
                  description: Maximum token TTL in seconds between 10s and 24hr.
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              examples:
                Ok:
                  summary: Ok
                  value:
                    id: f17b2843-b9b4-46be-9088-4cdbeec5a060
                    name: Weather Data API Service
                    description: Provides real-time weather data and forecasts for global locations. Includes current conditions, 7-day forecasts, and historical weather data.
