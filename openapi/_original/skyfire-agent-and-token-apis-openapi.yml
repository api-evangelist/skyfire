      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  description: Personal data for the user. Every field is optional.
                  properties:
                    person:
                      type: object
                      properties:
                        firstName:
                          type: string
                          description: Given name. e.g. `"John"`.
                        middleName:
                          type: string
                          description: Middle name. e.g. `"Rich"`.
                        lastName:
                          type: string
                          description: Family name. e.g. `"Doe"`.
                        birthdate:
                          type: string
                          description: Date of birth. e.g. `"1990-01-01"`
                        ids:
                          type: array
                          items:
                            properties:
                              type:
                                type: string
                                description: Kind of identity document. e.g. `"SSN"`.
                              number:
                                type: string
                                description: Document number. e.g. `"1234567890"`.
                              issueDate:
                                type: string
                                description: Date the document was issued. e.g. `"2020-01-01"`.
                              expirationDate:
                                type: string
                                description: Date the document expires. e.g. `"2025-01-01"`.
                              issuingAuthority:
                                type: string
                                description: Authority that issued the document. e.g. `"SSN"`.
                            type: object
                          description: Identity documents belonging to the user.
                      description: Name, date of birth, and identity documents.
                    phoneNumbers:
                      type: array
                      items:
                        properties:
                          type:
                            type: string
                            enum:
                            - Mobile
                            - Home
                            - Work
                            - Other
                            description: Kind of phone number.
                          countryCode:
                            type: string
                            description: Country calling code, without the leading plus. e.g. `"1"`.
                          areaCode:
                            type: string
                            description: Area or city code. e.g. `"234"`.
                          number:
                            type: string
                            description: Subscriber number. e.g. `"567890"`.
                        type: object
                      description: Phone numbers belonging to the user.
                    emailAddresses:
                      type: array
                      items:
                        properties:
                          type:
                            type: string
                            enum:
                            - Personal
                            - Work
                            - Other
                            description: Kind of email address.
                          address:
                            type: string
                            description: The email address. e.g. `"john.doe@example.com"`.
