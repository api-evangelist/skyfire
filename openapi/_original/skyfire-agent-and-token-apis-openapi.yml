  /api/v1/tokens/charge:
    post:
      summary: Charge Token
      description: Charge a `pay` or `kya-pay` token as a seller agent or seller service.
      operationId: charge-token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: 'The complete, signed JWT string received from the buyer agent.

                    '
                chargeAmount:
                  type: string
                  description: 'The amount to charge from the token. Required unless the seller service uses the `pay_per_use` pricing model, in which case Skyfire automatically charges the configured service price when omitted.

                    Tokens may be charged multiple times until their balance is exhausted.

                    When provided, `chargeAmount` must:

                    - Be greater than 0

                    - Be less than or equal to the token''s original `tokenAmount`

                    - Be less than or equal to the token''s remaining balance


                    A charge that exceeds the remaining balance will fail.'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              examples:
                Ok:
                  summary: Ok
                  value:
                    amountCharged: '0.01'
                    remainingBalance: '0.01'
              schema:
                type: object
                properties:
                  amountCharged:
                    type: string
                    example: '0.01'
                    description: The amount successfully charged from the token.
                  remainingBalance:
                    type: string
                    example: '0.01'
                    description: The amount remaining on the token after the charge is processed.
        '400':
          description: Bad Request
          content:
            text/plain:
              examples:
                Bad Request:
                  summary: Bad Request
                  value: "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n    <meta charset=\"utf-8\">\n    <title>Error</title>\n</head>\n\n<body>\n    <pre>Bad Request</pre>\n</body>\n\n</html>"
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    code: NOT_AUTHORIZED
                    message: invalid or expired jwt
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_AUTHORIZED
                  message:
                    type: string
                    example: invalid or expired jwt
        '402':
          description: Payment Required
          content:
            application/json:
              examples:
                Payment Required:
                  summary: Payment Required
                  value:
                    code: PAYMENT_ERROR
                    message: Invalid charge amount (must be less than token value)
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: PAYMENT_ERROR
                  message:
                    type: string
                    example: Invalid charge amount (must be less than token value)
