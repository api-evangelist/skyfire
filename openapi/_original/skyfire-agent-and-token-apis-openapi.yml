    post:
      summary: Set Organization User Personal Data
      description: As an Organization Admin, set personal data for a user in your organization.
      operationId: create-enterprise-user-1
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
